<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEM-CUBAL Dashboard</title>
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <div>
          <p class="eyebrow">Painel operacional</p>
          <h1>SEM-CUBAL</h1>
          <p class="subtitle">Visão rápida de utilizadores, projetos e tarefas em execução.</p>
        </div>
        <a class="link" href="/">Voltar à API</a>
      </header>

      <section class="stats-grid" id="stats-grid"></section>

      <section class="panel">
        <div class="panel-header">
          <h2>Estado das tarefas</h2>
        </div>
        <div id="status-breakdown"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Tarefas recentes</h2>
        </div>
        <table>
          <thead>
            <tr>
              <th>Tarefa</th>
              <th>Estado</th>
              <th>Prioridade</th>
              <th>Projeto</th>
              <th>Responsável</th>
            </tr>
          </thead>
          <tbody id="tasks-table-body"></tbody>
        </table>
      </section>
    </main>

    <script src="/dashboard.js"></script>
  </body>
</html>
